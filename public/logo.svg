<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Hexagon Shape -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Chat Bubble Shape -->
  <path d="M32 40C32 31.1634 39.1634 24 48 24H72C80.8366 24 88 31.1634 88 40V60C88 68.8366 80.8366 76 72 76H52L38 88V76H48C39.1634 76 32 68.8366 32 60V40Z" fill="#1E293B" stroke="url(#emeraldGrad)" stroke-width="2.5" opacity="0.85"/>

  <!-- Glowing Lightning Bolt Cutting Through -->
  <path d="M64 28L42 62H58L54 90L78 54H62L64 28Z" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <path d="M64 28L42 62H58L54 90L78 54H62L64 28Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Small Pulse Dot in top-right -->
  <circle cx="92" cy="28" r="6" fill="#10B981" filter="url(#glow)"/>
  <circle cx="92" cy="28" r="3" fill="#FFFFFF"/>
</svg>
